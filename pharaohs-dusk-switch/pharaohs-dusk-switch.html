<style>
:root{--bg:240,229,206;--fg:52,34,22}
*{box-sizing:border-box}

<body>
<main>
  <div class="kicker"><span>Material Studies</span><span>No. 062 · WebGL + Web Audio</span></div>
  <h1>Pharaoh's Dusk Switch.</h1>
  <p class="cap">A capsule of jelly crystal that drags the night across the Nile, and turns the Great Pyramid into a disco.</p>
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" role="slider" aria-label="Pharaoh's dusk switch, afternoon to midnight"
      aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="14:00, High Noon"></canvas>
  </div>
  <dl>
    <div><dt>Clock</dt><dd id="rClock">14:00</dd></div>
    <div><dt>Light</dt><dd id="rLight">High Noon</dd></div>
    <div><dt>Music</dt><dd id="rMusic">Desert Wind</dd></div>
  </dl>
  <div class="foot">
    <p class="hint">Drag the glass, or tap to flip it. Arrow keys, Home / End, Space.</p>
    <button id="snd" type="button" aria-pressed="false">Sound off</button>
  </div>
</main>

<script>
(()=>{'use strict';
/* ───────────── helpers ───────────── */
const W=176,H=50,N=W*H,KX0=20,KX1=156,KR=KX1-KX0,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sm=(a,b,v)=>{v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v)};
const fr=v=>v-Math.floor(v);
const hs=n=>fr(Math.sin(n*127.1+3.7)*43758.5453);
const B4=new Float32Array([0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16));
const bay=(x,y)=>B4[(y&3)<<2|(x&3)];
function mixc(a,b,t){const ar=a>>16&255,ag=a>>8&255,ab=a&255;
  return ((ar+((b>>16&255)-ar)*t)&255)<<16|((ag+((b>>8&255)-ag)*t)&255)<<8|((ab+((b&255)-ab)*t)&255);}

/* ───────────── state ───────────── */
let pos=0,vel=0,tgt=0,wob=0,wv=0,strX=1,strY=1,press=0;
let t=0,kx=KX0,skyT=0,beat=0,dz=0;
let mode=0,shades=false,party=false,partyAmt=0,guests=false,guestAmt=0;
const echoes=[];let echoT=0;
const NL=11,LX=[],lanLit=new Uint8Array(NL);
for(let i=0;i<NL;i++)LX.push(28+12*i);
const hm=/[#&]t=([\d.]+)/.exec(location.hash);if(hm){pos=tgt=clamp(+hm[1],0,1);}

/* ───────────── layout ───────────── */
const YB=new Int8Array(W),YH=new Int8Array(W);
for(let x=0;x<W;x++){YB[x]=27+Math.round(Math.sin(x*.08+2)*1.4);YH[x]=Math.max(YB[x],30+Math.round(Math.sin(x*.05+1)*1.5+Math.sin(x*.17)*.7));}
const AX=66,AY=9; /* the Great Pyramid's capstone: disco beacon */

/* ───────────── pixel buffers + sprite stamping ─────────────
   kind: 0 solid · 1 sky · 2 emissive · 3 water · 4 lantern flame · 5 sand · 6 gold capstone */
const alb=new Uint8Array(N*3),kind=new Uint8Array(N),skyN=new Uint8Array(N*3);
const outNow=new Uint8Array(N*4).fill(255),outLit=new Uint8Array(N*4).fill(255);
const L=new Int32Array(N).fill(-1);
const OUT=0x3a2416;
let bx0,by0,bx1,by1,OX=0,OY=0;
function begin(){bx0=W;by0=H;bx1=-1;by1=-1;}
function P(x,y,c){x=Math.round(x)+OX;y=Math.round(y)+OY;if(x<0||y<0||x>=W||y>=H)return;L[y*W+x]=c;
  if(x<bx0)bx0=x;if(x>bx1)bx1=x;if(y<by0)by0=y;if(y>by1)by1=y;}
function R(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)P(x+i,y+j,c);}
function E(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
  const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)P(x,y,c);}}
function line(x0,y0,x1,y1,f){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){f(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
const Ln=(x0,y0,x1,y1,c)=>line(x0,y0,x1,y1,(x,y)=>P(x,y,c));
function put(i,c,k){const j=i*3;alb[j]=c>>16&255;alb[j+1]=c>>8&255;alb[j+2]=c&255;kind[i]=k;}
/* stamp the sprite layer: light top edge, dark bottom edge, 1-px outline */
function stamp(k=0,flat=-1,out=OUT){
  if(bx1<0){begin();return;}
  const x0=Math.max(0,bx0-1),x1=Math.min(W-1,bx1+1),y0=Math.max(0,by0-1),y1=Math.min(H-1,by1+1);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*W+x;let c=L[i];
    if(c>=0){if(flat>=0)c=flat;else{const up=y>0?L[i-W]:-1,dn=y<H-1?L[i+W]:-1;
        if(up<0)c=mixc(c,0xffffff,.3);else if(dn<0)c=mixc(c,0,.24);}
      put(i,c,k);}
    else if(flat<0&&out>=0&&((x>0&&L[i-1]>=0)||(x<W-1&&L[i+1]>=0)||(y>0&&L[i-W]>=0)||(y<H-1&&L[i+W]>=0)))put(i,out,0);}
  for(let y=y0;y<=y1;y++)L.fill(-1,y*W+x0,y*W+x1+1);
  begin();}
function S(x,y,c,k=0){x=Math.round(x)+OX;y=Math.round(y)+OY;if(x<0||y<0||x>=W||y>=H)return;put(y*W+x,c,k);}
function F(x,y,w,h,c,k=0){for(let j=0;j<h;j++)for(let i=0;i<w;i++)S(x+i,y+j,c,k);}
const Ld=(x0,y0,x1,y1,c,k=0)=>line(x0,y0,x1,y1,(x,y)=>S(x,y,c,k));

/* ───────────── sky: day buffer (alb) and midnight buffer (skyN) ───────────── */
const SKY=[[0x2468c8,0x5aa6e6,0xd8eef0],[0x3a6cc0,0xa4b2c2,0xffc870],[0x3a1f70,0xc23a78,0xff8a3a],[0x070c33,0x101a50,0x26306e]];
const SKS=[0,.42,.68,1];
function skyKey(k,f){const c=SKY[k];return f<.5?mixc(c[0],c[1],f/.5):mixc(c[1],c[2],(f-.5)/.5);}
function skyCol(f,s){let k=0;while(k<2&&s>SKS[k+1])k++;const u=clamp((s-SKS[k])/(SKS[k+1]-SKS[k]),0,1);
  return mixc(skyKey(k,f),skyKey(k+1,f),u);}
const STARS=[];for(let k=0;k<44;k++)STARS.push([Math.floor(hs(k)*W),Math.floor(hs(k+99)*25),hs(k+7)]);
const SAH=[[128,4],[144,3],[133,10],[136,11],[139,12],[130,18],[147,17]]; /* Sah, the star-figure of Orion */
const SAHL=[[0,2],[1,4],[2,3],[3,4],[2,5],[4,6]];
function setN(x,y,c){if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*3;skyN[i]=c>>16&255;skyN[i+1]=c>>8&255;skyN[i+2]=c&255;}
function getN(x,y){const i=(y*W+x)*3;return skyN[i]<<16|skyN[i+1]<<8|skyN[i+2];}
let sunX=0,sunY=0;
function drawSkies(T){
  const s=skyT;
  for(let y=0;y<30;y++)for(let x=0;x<W;x++){if(y>=YB[x])continue;
    let f=clamp(y/27+(bay(x,y)-.5)*.16,0,1);f=Math.round(f*6)/6;
    put(y*W+x,skyCol(f,s),1);setN(x,y,skyCol(f,1));}
  /* the sun: high and glaring, then sinking behind the far pyramid */
  sunX=Math.round(126+20*sm(0,.75,s));sunY=Math.round(4+24*sm(.08,.74,s));
  const sc=mixc(mixc(0xfffbe6,0xffc24a,sm(.2,.45,s)),0xff5a2a,sm(.45,.72,s));
  const sp=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<YB[x]&&kind[y*W+x]===1)put(y*W+x,c,1);};
  const glare=1-sm(.2,.5,s);
  for(let dy=-8;dy<=8;dy++)for(let dx=-8;dx<=8;dx++){const d=Math.sqrt(dx*dx+dy*dy),x=sunX+dx,y=sunY+dy;
    if(x<0||x>=W||y<0||y>=YB[x])continue;
    if(d<=4.2){const band=s>.4&&dy>0&&(dy&1)&&d>1.5;sp(x,y,band?mixc(sc,0xb02a50,.35):d<2.5?mixc(sc,0xffffff,.5):sc);}
    else if(d<7.5&&(1-(d-4.2)/3.3)*(.55+glare*.4)>bay(x,y)){const i=(y*W+x)*3,c0=alb[i]<<16|alb[i+1]<<8|alb[i+2];sp(x,y,mixc(c0,sc,.45));}}
  if(glare>.3)for(let a=0;a<8;a++)if((a+Math.floor(T*2.5))&1){const r=6+(a&1);sp(Math.round(sunX+Math.cos(a*PI/4)*r),Math.round(sunY+Math.sin(a*PI/4)*r),0xfffbd8);}
  /* midnight: twinkling stars, Sah, a crescent moon */
  for(const[x,y,b]of STARS){if(y>=YB[x])continue;const tw=Math.sin(T*(1.5+b*2)+b*40);if(tw<-.5)continue;
    setN(x,y,mixc(getN(x,y),0xffffff,tw>.5?.95:.5+b*.3));}
  for(const[a,b]of SAHL){const p=SAH[a],q=SAH[b];line(p[0],p[1],q[0],q[1],(x,y)=>{if((x+y)&1&&y<YB[x])setN(x,y,mixc(getN(x,y),0x8fa4ff,.28));});}
  SAH.forEach(([x,y],k)=>{const c=Math.sin(T*2.3+k)>-.3?0xffffff:0xc8d4ff;setN(x,y,c);if(k===0||k===6){setN(x-1,y,mixc(getN(x-1,y),c,.5));setN(x+1,y,mixc(getN(x+1,y),c,.5));}});
  const mx=24,my=7;
  for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++){const d=dx*dx+dy*dy,x=mx+dx,y=my+dy;if(x<0||y<0||y>=YB[x]||x>=W)continue;
    if(d<=16&&!((dx+2)*(dx+2)+(dy-1)*(dy-1)<=11))setN(x,y,d<=6?0xfffbe8:0xf4ecc4);
    else if(d<=46&&(1-d/46)*.8>bay(x,y))setN(x,y,mixc(getN(x,y),0x8ea0e8,.35));}
}

/* ───────────── backdrop: dunes, sand, promenade, Nile, near bank ───────────── */
function drawBack(T){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;let c,k=5;
    if(y<YB[x])continue;
    if(y<YH[x]){c=y===YB[x]?0xf4dcaa:0xeacd94;}
    else if(y<=35){c=0xe2b56c;if(((x*2+y*5)%9)===0)c=0xd29f58;else if(((x*3+y*7)%13)===0)c=0xedc684;
      if(y===YH[x])c=0xeec98a;if(y===35)c=0xd4a65e;}
    else if(y===36){k=0;c=(x%7)===0?0xc9aa74:0xe8d2a0;}
    else if(y===37){k=0;c=(x%7)===3?0x8a6a40:0xa8875a;}
    else if(y<=46){k=3;c=mixc(0x3cc8c4,0x1784a2,(y-38)/8);
      if(y===38)c=0x2f9fae;
      const rp=Math.sin(x*.42-T*1.8+y*2.1)+Math.sin(x*.13+T*.7+y*1.3);
      if(rp>1.55)c=0xaaf2ea;else if(rp>1.2)c=mixc(c,0xaaf2ea,.4);}
    else{c=y===47?0xb88a4e:0xd8aa60;if(((x*5+y*3)%11)===0)c=0xc89a52;}
    put(i,c,k);}
}
/* ───────────── monuments ───────────── */
function pyramid(cx,ay,by,cap,hz){
  begin();
  for(let y=ay;y<=by;y++){const r=y-ay,tier=(r/3)|0,hw=tier*3+1;
    for(let x=cx-hw;x<=cx+hw;x++){let c=x<cx?0xd2b47c:0xefd8a2;
      if(r%3===2)c=mixc(c,0x8a6a40,.32);else if(((x+tier*3)%6)===0)c=mixc(c,0x8a6a40,.22);
      if(hs(x*3.1+y*7.7)<.07)c=mixc(c,0x9a7a4a,.35);
      if(hz)c=mixc(c,0xf0dcb8,hz);P(x,y,c);}}
  stamp();
  for(let y=ay;y<ay+cap;y++){const tier=((y-ay)/3)|0,hw=tier*3+1;
    for(let x=cx-hw;x<=cx+hw;x++)S(x,y,x<cx?0xe2a232:((x+y)&1?0xffd25a:0xffe07a),6);}
}
function obelisk(x,top,by){
  begin();R(x,top,4,by-top+1,0xdcb67c);R(x+1,top-1,2,1,0xdcb67c);stamp();
  S(x+1,top-1,0xffd25a,6);S(x+2,top-1,0xffe07a,6);S(x+1,top,0xe2a232,6);S(x+2,top,0xffd25a,6);
  for(let y=top+2;y<by-1;y++)for(let i=1;i<3;i++)if(hs(x*1.7+y*3.9+i*11.3)<.42)S(x+i,y,0x8a6234);
  F(x,top+1,1,by-top,0xc39c62);
}
function farPalm(x,y0){for(let j=0;j<4;j++)S(x,y0-j,0x8a8a58);
  F(x-2,y0-5,5,1,0x76905a);S(x-3,y0-4,0x76905a);S(x+3,y0-4,0x76905a);S(x,y0-6,0x76905a);}
function datePalm(x,base,sw){
  begin();
  const top=base-15;let tx=x,ty=top;
  for(let j=0;j<=15;j++){const px=x+Math.round(j*j*.011+sw*j*.03);P(px,base-j,(j&1)?0x8a5a30:0xa8743e);P(px+1,base-j,0x9a6634);if(j===15){tx=px;ty=base-j;}}
  stamp();
  begin();
  for(const[dx,up,len]of[[-1,.45,8],[-.7,.95,6],[0,1.4,3],[.7,.95,6],[1,.45,8],[-.9,.1,6],[.9,.1,6]]){
    for(let j=1;j<=len;j++){const px=tx+dx*j+sw*j*.09,py=ty-up*j+.075*j*j;P(px,py,0x43a04c);if(j<len-1)P(px,py+1,0x2f7e3c);}}
  P(tx,ty,0x43a04c);P(tx+1,ty,0x43a04c);
  stamp();
  S(tx-1,ty+2,0xc0502a);S(tx,ty+2,0xa8401e);S(tx+2,ty+2,0xc0502a);S(tx+1,ty+3,0xa8401e);
}
function papyrus(x,base,h,sw){const tx=x+Math.round(sw*h*.09),ty=base-h;
  Ld(x,base,tx,ty+1,0x4f9a40);
  S(tx,ty,0x7fbf52);S(tx-1,ty,0x9fd062);S(tx+1,ty,0x9fd062);S(tx-2,ty+1,0x8ac858);S(tx+2,ty+1,0x8ac858);S(tx,ty-1,0xc4e47a);}
function lantern(x){F(x,32,1,4,0x5a3a20);S(x,35,0x3a2416);S(x-1,31,0x8a5a24);S(x,31,0xd9a444);S(x+1,31,0x8a5a24);S(x,30,0x4a3020,4);S(x,29,0x4a3020,4);}

/* ───────────── the Great Sphinx ───────────── */
const ST=0xdcb878,STD=0xb88e52,LAP=0x3a64b0,GLD=0xe8be58;
function sHead(hx,hy,tw){
  R(hx-5,hy,11,3,ST);R(hx-6,hy+3,13,4,ST);
  R(hx-7,hy+7-tw,3,6,ST);R(hx+5,hy+7,3,6,ST);R(hx-3,hy+7,7,5,ST);
}
function sFace(hx,hy,eyes,tw){
  for(let y=hy;y<=hy+6;y++){const c=((y-hy)&1)?LAP:GLD,hw=y<hy+3?5:6;
    for(let x=hx-hw;x<=hx+hw;x++){if(y>=hy+3&&x>=hx-3&&x<=hx+3)continue;S(x,y,c);}}
  for(let y=hy+7;y<=hy+12;y++){const c=((y-hy)&1)?LAP:GLD;F(hx-7,y-tw,3,1,c);F(hx+5,y,3,1,c);}
  F(hx-3,hy+3,7,1,GLD);F(hx-3,hy+4,7,8,ST);F(hx+2,hy+4,2,8,0xe6c68a);F(hx-3,hy+11,7,1,STD);
  S(hx,hy+1,0xffd040);S(hx,hy+2,0xd04030);
  S(hx,hy+7,STD);S(hx,hy+8,STD);F(hx-1,hy+9,3,1,0x8a5e34);
  const ey=hy+5,EK=0x24160c;
  if(eyes===3){F(hx-3,ey-1,7,1,0x14101c);F(hx-3,ey,3,1,0x14101c);F(hx+1,ey,3,1,0x14101c);
    S(hx-3,ey-1,0x6ff0ff,2);S(hx+1,ey-1,0xffd040,2);}
  else{
    if(eyes===0){F(hx-2,ey,2,1,0x9a7040);F(hx+1,ey,2,1,0x9a7040);}
    else if(eyes===1){F(hx-2,ey,2,1,EK);S(hx-2,ey-1,0xfff4dc);F(hx+1,ey,2,1,0x9a7040);}
    else{F(hx-2,ey,2,1,EK);F(hx+1,ey,2,1,EK);S(hx-2,ey-1,0xfff4dc);S(hx+1,ey-1,0xfff4dc);}}
}
function sphinx(md,T,bi,bp,flat,ox,oy){
  const music=t>.36,A=bi&1;
  OX=ox;OY=oy;
  let hx=118,hy=15,tw=0;
  if(md===1)tw=fr(T*.55)<.1?1:0;
  if(md===2&&music&&bp<.3)hy+=1;
  if(md>=3){hy=9;if(md===3&&bp<.3)hy+=1;}
  if(md===4)hx+=A?1:-1;

    o.frequency.exponentialRampToValueAtTime(f*1.6,t0+dt+.035);o.frequency.exponentialRampToValueAtTime(f*.85,t0+dt+.11);ad(g,t0+dt,.004,v,.1);
    const gn=G(0,d);nz(t0+dt,.04,BQ('bandpass',2400,1.5,gn));ad(gn,t0+dt,.002,.15,.03);}}
function sHawk(){const c=A.ctx,t0=c.currentTime+.02,d=pan(Math.random()*1.4-.7,A.gn),g=G(0,d);
  const o=osc('sine',2700,t0,.75,g);o.frequency.exponentialRampToValueAtTime(1750,t0+.65);
  const o2=osc('sine',5400,t0,.75,G(.25,g));o2.frequency.exponentialRampToValueAtTime(3500,t0+.65);
  const v=osc('sine',23,t0,.75,null),vg=G(90,o.frequency);v.connect(vg);
  g.gain.setValueAtTime(.0008,t0);g.gain.exponentialRampToValueAtTime(.07,t0+.06);g.gain.exponentialRampToValueAtTime(.0008,t0+.7);}
function audioFrame(spd,dt){
  if(!A.ctx)return;const c=A.ctx,n=c.currentTime,lv=A.lv;
  A.gn.gain.setTargetAtTime(lv.n*.6,n,.2);A.g1.gain.setTargetAtTime(lv.l1*(party?.7:1),n,.15);
  A.g2.gain.setTargetAtTime(lv.l2,n,.15);if(!party)A.g2k.gain.setTargetAtTime(lv.l2,n,.15);
  A.g3.gain.setTargetAtTime(lv.l3,n,.15);
  A.lp.frequency.setTargetAtTime(600*Math.pow(28,sm(.05,.62,t)),n,.1);
  A.rubG.gain.setTargetAtTime(Math.min(.16,spd*.08)*(drag?1:.35),n,.04);A.rubF.frequency.setTargetAtTime(1400+Math.min(spd,3)*900,n,.05);
  if(live()&&lv.n>.3){A.hawkT-=dt;if(A.hawkT<=0){A.hawkT=6+Math.random()*7;sHawk();}}
}
const sndBtn=document.getElementById('snd');
function setSound(on){
  if(on&&!A.ctx)initAudio();if(!A.ctx)return;
  A.on=on;if(on)A.ctx.resume();A.master.gain.setTargetAtTime(on?1:0,A.ctx.currentTime,.03);
  sndBtn.textContent=on?'Sound on':'Sound off';sndBtn.setAttribute('aria-pressed',on?'true':'false');
}
let wantSound=true;
const firstTouch=()=>{if(wantSound&&!A.on)setSound(true);};
sndBtn.addEventListener('click',()=>{wantSound=!A.on;setSound(!A.on);});

/* ───────────── input ───────────── */
let drag=null;
const toScene=e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width;return{x:((e.clientX-r.left)*k-29*SC)/SC,y:((e.clientY-r.top)*k-29*SC)/SC};};
cv.addEventListener('pointerdown',e=>{
  if(e.button)return;const s=toScene(e);if(s.x<-8||s.x>184||s.y<-8||s.y>58)return;
  firstTouch();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const k=KX0+KR*pos,on=Math.abs(s.x-k)<17;
  drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,moved:false,off:on?s.x-k:0};
  press=1;cv.classList.add('drag');sGrab();
});
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<5)return;drag.moved=true;}
  tgt=clamp((toScene(e).x-drag.off-KX0)/KR,0,1);
});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved&&e.type==='pointerup')tgt=pos<.5?1:0;
  drag=null;press=0;cv.classList.remove('drag');sRelease();};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('keydown',e=>{
  let v=null;
  switch(e.key){case'ArrowRight':case'ArrowUp':v=tgt+.05;break;case'ArrowLeft':case'ArrowDown':v=tgt-.05;break;
    case'PageUp':v=tgt+.2;break;case'PageDown':v=tgt-.2;break;case'Home':v=0;break;case'End':v=1;break;
    case' ':case'Enter':v=tgt<.5?1:0;break;default:return;}
  e.preventDefault();firstTouch();tgt=clamp(v,0,1);
});

/* ───────────── simulation + story ───────────── */
function physics(dt){
  let n=Math.max(1,Math.ceil(dt*240));const h=dt/n;
  for(;n--;){
    const acc=170*(tgt-pos)-17*vel;vel+=acc*h;pos+=vel*h;
    if(pos<0){pos=0;if(vel<0){wv+=vel*.5;vel*=-.25;}}
    if(pos>1){pos=1;if(vel>0){wv+=vel*.5;vel*=-.25;}}
    wv+=(-420*wob-9*wv-acc*.3)*h;wob+=wv*h;
  }
  wob=clamp(wob,-.2,.2);
  strX=clamp((1+Math.min(.3,Math.abs(vel)*.05))*(1+wob),.88,1.36);strY=1/Math.sqrt(strX);
}
function story(dt,T){
  t=clamp(pos,0,1);kx=KX0+KR*t;skyT=clamp(t*1.08,0,.92);dz=sm(.05,.8,t);
  const sh=t>=(shades?.58:.6);if(sh!==shades){shades=sh;if(sh)sSphinx();}
  for(let i=0;i<NL;i++){const on=kx+4>=LX[i]?1:0;if(on!==lanLit[i]){lanLit[i]=on;sLantern(i,on);}}
  const pt=t>(party?.86:.9);if(pt!==party){party=pt;if(pt)sPartyIn();else sPartyOut();}
  partyAmt=clamp(partyAmt+(party?dt*1.6:-dt*2.2),0,1);
  mode=party?4:shades?3:t<.2?0:t<.4?1:2;
  const gi=t>=(guests?.83:.85);if(gi!==guests){guests=gi;if(gi)sBark();}
  guestAmt=clamp(guestAmt+(guests?dt*.9:-dt*1.5),0,1);
  for(const e of echoes)e.age+=dt;while(echoes.length&&echoes[0].age>.5)echoes.shift();
  echoT-=dt;if(Math.abs(vel)*KR>70&&echoT<=0){echoT=.055;echoes.push({x:KX0+KR*pos,dir:Math.sign(vel),age:0});}
  const lv=A.lv;lv.n=1-sm(.1,.3,t);lv.l1=sm(.08,.2,t);lv.l2=sm(.3,.42,t);lv.l3=sm(.52,.66,t);
  beat=(A.ctx&&A.ctx.state==='running')?Math.max(0,(A.ctx.currentTime-A.t0)/(STEP*4)):T/(STEP*4);
}
/* ───────────── page + readouts ───────────── */
const $=id=>document.getElementById(id),rClock=$('rClock'),rLight=$('rLight'),rMusic=$('rMusic'),root=document.documentElement,
  theme=document.querySelector('meta[name=theme-color]');
let lastBg='',lastFg='',lastAria=-1,bg=[240,229,206];
function ui(){
  const c0=[240,229,206],c1=[168,104,104],c2=[14,18,50],u=dz<.5?dz/.5:(dz-.5)/.5,a=dz<.5?c0:c1,b=dz<.5?c1:c2;
  bg=a.map((v,i)=>Math.round(v+(b[i]-v)*u));
  const sb=bg.join(',');if(sb!==lastBg){lastBg=sb;root.style.setProperty('--bg',sb);theme.content='rgb('+sb+')';}
  const sf=bg[1]<118?'236,232,248':'52,34,22';if(sf!==lastFg){lastFg=sf;root.style.setProperty('--fg',sf);}
  const m=Math.round(840+600*t)%1440,ck=String((m/60)|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const li=party?'Pyramid Disco':t<.2?'High Noon':t<.42?'Golden Hour':t<.62?'Sunset':'Starlight';
  const mu=party?'Nile Rave':t<.14?'Desert Wind':t<.36?'Oud Plucks':t<.59?'Darbuka':'Mizmar Band';
  if(rClock.textContent!==ck)rClock.textContent=ck;if(rLight.textContent!==li)rLight.textContent=li;if(rMusic.textContent!==mu)rMusic.textContent=mu;
  const av=Math.round(tgt*100);if(av!==lastAria||cv.getAttribute('aria-valuetext')!==ck+', '+li){lastAria=av;cv.setAttribute('aria-valuenow',av);cv.setAttribute('aria-valuetext',ck+', '+li);}
}
/* ───────────── go ───────────── */
if(!gl){stage.innerHTML='<p class="nogl">This study needs WebGL2.</p>';return;}
try{initGL();}catch(err){console.error(err);stage.innerHTML='<p class="nogl">The shader failed to compile on this device.</p>';return;}
resize();new ResizeObserver(resize).observe(stage);window.addEventListener('resize',resize);
if(hm){for(let i=0;i<220;i++){physics(.02);story(.02,i*.02-9);}echoes.length=0;}
let last=performance.now()/1000;
function frame(ms){
  const T=ms/1000,dt=clamp(T-last,0,.05);last=T;
  physics(dt);story(dt,T);drawScene(T);light(T);ui();render(bg);audioFrame(Math.abs(vel),dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
