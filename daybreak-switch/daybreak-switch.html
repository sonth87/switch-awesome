<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17152b">
<title>Daybreak Switch — Material Studies No. 062</title>
<style>
:root{--bg:23,21,43;--fg:236,234,248}
*{box-sizing:border-box}
html,body{margin:0;background:rgb(var(--bg));color:rgb(var(--fg));overflow-x:hidden}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
main{width:min(100%,940px);padding:clamp(24px,6vh,64px) 16px}
.kicker{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--fg),.74);
  border-top:1px solid rgba(var(--fg),.2);padding-top:10px}
h1{font:italic 400 clamp(40px,9vw,86px)/1 "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  letter-spacing:-.02em;margin:.4em 0 .22em}
.cap{margin:0;max-width:44ch;color:rgba(var(--fg),.7)}
.stage{margin:clamp(8px,3vh,36px) -16px;display:flex;justify-content:center}
canvas{display:block;touch-action:pan-y;cursor:grab;outline:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent}
canvas.drag{cursor:grabbing}
canvas:focus-visible{outline:1px dashed rgba(var(--fg),.5);outline-offset:-4px}
dl{display:grid;grid-template-columns:repeat(3,1fr);margin:0;
  border-top:1px solid rgba(var(--fg),.2);border-bottom:1px solid rgba(var(--fg),.2)}
dl div{padding:12px 0}
dl div+div{padding-left:14px;border-left:1px solid rgba(var(--fg),.2)}
dt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(var(--fg),.74)}
dd{margin:2px 0 0;font:500 clamp(14px,2.6vw,20px)/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-top:14px}
.hint{margin:0;font-size:12px;color:rgba(var(--fg),.74)}
button{font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:inherit;background:none;
  border:1px solid rgba(var(--fg),.35);border-radius:999px;padding:8px 16px;cursor:pointer}
button:hover{background:rgba(var(--fg),.08)}
button:focus-visible{outline:2px solid rgba(var(--fg),.7);outline-offset:2px}
.nogl{padding:40px 16px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="kicker"><span>Material Studies</span><span>No. 062 · WebGL + Web Audio</span></div>
  <h1>Daybreak Switch.</h1>
  <p class="cap">A knob of jelly glass that drags the morning across a small pixel room, and wakes whoever is in it.</p>
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" role="slider" aria-label="Daybreak switch, night to morning"
      aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="02:00, Night"></canvas>
  </div>
  <dl>
    <div><dt>Clock</dt><dd id="rClock">02:00</dd></div>
    <div><dt>Light</dt><dd id="rLight">Night</dd></div>
    <div><dt>Music</dt><dd id="rMusic">Crickets</dd></div>
  </dl>
  <div class="foot">
    <p class="hint">Drag the glass, or tap to flip it. Arrow keys, Home / End, Space.</p>
    <button id="snd" type="button" aria-pressed="false">Sound off</button>
  </div>
</main>

<script>
(()=>{'use strict';
/* ───────────── helpers ───────────── */
const W=176,H=50,N=W*H,KX0=20,KX1=156,KR=KX1-KX0,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sm=(a,b,v)=>{v=clamp((v-a)/(b-a),0,1);return v*v*(3-2*v)};
const fr=v=>v-Math.floor(v);
const hs=n=>fr(Math.sin(n*127.1+3.7)*43758.5453);
const B4=new Float32Array([0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16));
const bay=(x,y)=>B4[(y&3)<<2|(x&3)];
function mixc(a,b,t){const ar=a>>16&255,ag=a>>8&255,ab=a&255;
  return ((ar+((b>>16&255)-ar)*t)&255)<<16|((ag+((b>>8&255)-ag)*t)&255)<<8|((ab+((b&255)-ab)*t)&255);}

/* ───────────── state ───────────── */
let pos=0,vel=0,tgt=0,wob=0,wv=0,strX=1,strY=1,press=0;
let t=0,kx=KX0,sky=0,beat=0,dz=0;
let lampOn=false,catAwake=false,party=false,partyAmt=0;
let pupIn=false,pupPos=0,doorOp=0,pupWait=false,knockT=0;
const hits=[],echoes=[];let echoT=0;
const NB=11,BX=[],BY=[],bulbLit=new Uint8Array(NB);
const wireY=x=>Math.round(1+2.2*Math.sin(PI*(x-6)/164));
for(let i=0;i<NB;i++){BX.push(38+12*i);BY.push(wireY(38+12*i)+1);}
const BCOL=[0xff6b5e,0xffd24a,0x5fe0b0,0x5fb8ff,0xff8fd0,0xa98bff];
const hm=/[#&]t=([\d.]+)/.exec(location.hash);if(hm){pos=tgt=clamp(+hm[1],0,1);}

/* ───────────── pixel room: buffers + sprite stamping ───────────── */
const alb=new Uint8Array(N*3),kind=new Uint8Array(N),skyD=new Uint8Array(N*3);
const outNow=new Uint8Array(N*4).fill(255),outLit=new Uint8Array(N*4).fill(255);
const L=new Int32Array(N).fill(-1);
const OUT=0x2b2140;
let bx0,by0,bx1,by1,OX=0,OY=0;
function begin(){bx0=W;by0=H;bx1=-1;by1=-1;}
function P(x,y,c){x=(x|0)+OX;y=(y|0)+OY;if(x<0||y<0||x>=W||y>=H)return;L[y*W+x]=c;
  if(x<bx0)bx0=x;if(x>bx1)bx1=x;if(y<by0)by0=y;if(y>by1)by1=y;}
function R(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)P(x+i,y+j,c);}
function E(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
  const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)P(x,y,c);}}
function line(x0,y0,x1,y1,f){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){f(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
const Ln=(x0,y0,x1,y1,c)=>line(x0,y0,x1,y1,(x,y)=>P(x,y,c));
function put(i,c,k){const j=i*3;alb[j]=c>>16&255;alb[j+1]=c>>8&255;alb[j+2]=c&255;kind[i]=k;}
/* stamp the sprite layer: light top edge, dark bottom edge, 1-px outline */
function stamp(k=0,flat=-1,out=OUT){
  if(bx1<0){begin();return;}
  const x0=Math.max(0,bx0-1),x1=Math.min(W-1,bx1+1),y0=Math.max(0,by0-1),y1=Math.min(H-1,by1+1);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*W+x;let c=L[i];
    if(c>=0){if(flat>=0)c=flat;else{const up=y>0?L[i-W]:-1,dn=y<H-1?L[i+W]:-1;
        if(up<0)c=mixc(c,0xffffff,.3);else if(dn<0)c=mixc(c,0,.24);}
      put(i,c,k);}
    else if(flat<0&&out>=0&&((x>0&&L[i-1]>=0)||(x<W-1&&L[i+1]>=0)||(y>0&&L[i-W]>=0)||(y<H-1&&L[i+W]>=0)))put(i,out,out===OUT?0:k);}
  for(let y=y0;y<=y1;y++)L.fill(-1,y*W+x0,y*W+x1+1);
  begin();}
/* direct pixels (details on top of stamped sprites) */
function S(x,y,c,k=0){x=(x|0)+OX;y=(y|0)+OY;if(x<0||y<0||x>=W||y>=H)return;put(y*W+x,c,k);}
function F(x,y,w,h,c,k=0){for(let j=0;j<h;j++)for(let i=0;i<w;i++)S(x+i,y+j,c,k);}
function Dd(cx,cy,r,c,k=0){for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++)
  if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r)S(x,y,c,k);}
const Ld=(x0,y0,x1,y1,c,k=0)=>line(x0,y0,x1,y1,(x,y)=>S(x,y,c,k));
function inset(x,y,w,h,dk,lt){F(x,y,w,1,dk);F(x,y,1,h,dk);F(x,y+h-1,w,1,lt);F(x+w-1,y,1,h,lt);}

/* ───────────── window sky ───────────── */
const GX=33,GY=10,GW=38,GH=16;
const STARS=[[2,1],[7,4],[12,2],[17,6],[22,1],[26,4],[31,7],[35,2],[9,8],[20,9],[33,10],[4,6]];
const TOWN=[[-1,7,4,0],[5,7,6,1],[12,8,3,2],[19,7,7,0],[26,6,5,1],[31,8,4,2]];
const TWALL=[0xf7e2c4,0xf2b8a8,0xbfe0e6],TROOF=[0xd95f4b,0x7a5bb5,0x2f8f8a];
function skyCol(f,s){const n=mixc(0x0c1136,0x2a2e70,f),
  d=f<.55?mixc(0x4a3a8c,0xe8829a,f/.55):mixc(0xe8829a,0xffca8e,(f-.55)/.45),y=mixc(0x4faeee,0xc8edfb,f);
  return s<.5?mixc(n,d,sm(0,.5,s)):mixc(d,y,sm(.5,1,s));}
function drawSky(s,set,T){
  const pp=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&x<GW&&y>=0&&y<GH)set(GX+x,GY+y,c);};
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){let f=clamp(j/(GH-1)+(bay(i,j)-.5)*.2,0,1);f=Math.round(f*5)/5;set(GX+i,GY+j,skyCol(f,s));}
  const sa=1-sm(.1,.42,s);
  if(sa>.05)STARS.forEach(([x,y],k)=>{const tw=Math.sin(T*2.2+k*1.9);
    if(tw>-.55&&sa>hs(k)*.8)pp(x,y,mixc(skyCol(y/(GH-1),s),0xffffff,sa*(tw>.4?1:.6)));});
  const my=Math.round(3+s*30);
  if(my<GH+3)for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)
    if(dx*dx+dy*dy<=7.3&&!((dx-1.5)*(dx-1.5)+(dy+1)*(dy+1)<=5.2))pp(29+dx,my+dy,0xfff3c4);
  const rise=sm(.22,.95,s),sy=Math.round(GH+3-rise*14),sx=9,sc=mixc(0xff7650,0xffe36a,sm(.45,.9,s));
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const d=dx*dx+dy*dy;if(d<=9.5)pp(sx+dx,sy+dy,d<=2.5?mixc(sc,0xffffff,.45):sc);}
  if(s>.8)for(let a=0;a<8;a++)if((a+Math.floor(T*2))&1)pp(sx+Math.cos(a*PI/4)*5,sy+Math.sin(a*PI/4)*5,0xfff0a0);
  const cs=sm(.6,.9,s);
  if(cs>0)for(let k=0;k<2;k++){const cx=Math.round(fr(T*.03+k*.5)*(GW+14)-12),cy=2+k*5;
    for(let i=0;i<9;i++){const x=cx+i;if(cs<bay(x&3,cy))continue;
      if(i>=2&&i<=6)pp(x,cy,0xffffff);pp(x,cy+1,0xffffff);if(i>=1&&i<=7)pp(x,cy+2,0xdcf0fb);}}
  const dd=sm(.3,.8,s);
  TOWN.forEach(([x,w,h,ci],k)=>{const yT=GH-h,wc=mixc(0x171b48,TWALL[ci],dd),rc=mixc(0x0e1132,TROOF[ci],dd);
    for(let j=yT;j<GH;j++)for(let i=0;i<w;i++)pp(x+i,j,i===w-1?mixc(wc,0,.12):wc);
    for(let r=0;r<3;r++)for(let i=x-1+r;i<=x+w-r;i++)pp(i,yT-1-r,r===0?mixc(rc,0,.15):rc);
    const on=s<.32+k*.05&&(k!==2||Math.sin(T*.7)>-.3),wcol=on?0xffd766:mixc(0x2a2f66,0x5d7fb0,dd);
    pp(x+2,yT+1,wcol);if(w>=7)pp(x+w-3,yT+1,wcol);});
}

/* ───────────── room pieces ───────────── */
function drawBack(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let c;
    if(y<27){c=0xf3d67c;if(((x+y)&7)===0||((x-y+64)&7)===0)c=0xe4bf5e;
      if(((x&7)===4&&(y&7)===0)||((x&7)===0&&(y&7)===4))c=0xfbe9a6;}
    else if(y===27)c=0xfff3d6;else if(y===28)c=0x2f6f73;
    else if(y<38){c=0x46a39c;const m=x&7;if(m===3)c=0x37877f;else if(m===4)c=0x5bb8b0;if(y===29)c=mixc(c,0xffffff,.18);if(y===37)c=mixc(c,0,.15);}
    else if(y===38)c=0xf1e6cc;else if(y===39)c=0x5a3b34;
    else{const pi=((y-40)/3)|0,m=(y-40)%3;c=pi&1?0xc48552:0xcc8d58;if(m===0)c=mixc(c,0xffffff,.12);
      if(m===2)c=0xa8693d;else if((x+pi*13)%22===0)c=0xa8693d;}
    put(y*W+x,c,0);}
}
function drawDoor(T){
  begin();R(7,7,19,33,0xf3ead2);stamp();
  if(doorOp>.02){for(let y=9;y<=39;y++)for(let x=9;x<=23;x++)S(x,y,y>34?0xe9812f:mixc(0xff9a3c,0xffc662,(y-9)/26),2);
    F(13,13,7,8,0xffe2a0,2);F(16,13,1,8,0xffb65a,2);F(13,16,7,1,0xffb65a,2);}
  const w=Math.round(15-11*sm(0,1,doorOp));
  let j=0;for(const h of hits){const a=T-h;if(a>=0&&a<.07)j=2;else if(a>=.07&&a<.13&&j<1)j=1;}
  OX=doorOp>.02?0:j;
  begin();R(9,9,w,30,doorOp>.5?0x7aa9f0:0x5b8fe0);stamp();
  if(w===15){inset(11,11,11,11,0x3f6ec2,0x86b3f2);inset(11,24,11,13,0x3f6ec2,0x86b3f2);S(22,22,0xf0c35a);S(22,23,0xb9862f);}
  else{F(9+w-1,10,1,28,0x9cc4fa);}
  OX=0;
  if(doorOp<.02){F(9,39,15,1,pupWait?0xffc45e:0x3a2a3a,pupWait?2:0);
    if(pupWait){F(12+Math.round(Math.sin(T*3.1)*2),39,2,1,0x6b3d1e);F(19+Math.round(Math.sin(T*2.3+1)*2),39,2,1,0x6b3d1e);}}
}
function drawWindow(T){
  begin();R(31,8,42,20,0xf6eed8);R(29,27,46,2,0xf6eed8);stamp();
  drawSky(sky,(x,y,c)=>put(y*W+x,c,1),T);
  drawSky(Math.max(sky,.85),(x,y,c)=>{const i=(y*W+x)*3;skyD[i]=c>>16&255;skyD[i+1]=c>>8&255;skyD[i+2]=c&255;},T);
  F(51,10,2,16,0xf6eed8);F(33,17,38,1,0xf6eed8);F(53,10,1,16,0xd8cdb2);F(33,18,18,1,0xd8cdb2);F(54,18,17,1,0xd8cdb2);
  for(let side=0;side<2;side++){begin();
    for(let y=8;y<=26;y++){const w=y<17?6:y<20?4:5;for(let i=0;i<w;i++)P(side?75-i:28+i,y,(i&1)?0xd7647b:0xec7f93);}
    stamp();F(side?72:28,18,4,1,0xfbe9c8);}
  F(26,7,52,1,0xc9973f);S(25,7,0x8a6426);S(78,7,0x8a6426);
}
function drawWall(T){
  /* picture: a little jelly shark */
  begin();R(126,8,15,11,0xb0703f);stamp();
  F(128,10,11,7,0xcdeff2);F(128,16,11,1,0xb4e2e8);
  F(130,12,6,3,0x6ec6ea);S(129,13,0x6ec6ea);F(130,14,5,1,0xe4f7fd);S(132,11,0x6ec6ea);S(133,11,0x4fa9d4);
  S(136,13,0x6ec6ea);S(137,12,0x4fa9d4);S(137,14,0x4fa9d4);S(131,12,OUT);S(133,12,0xffffff);S(135,10,0xffffff);S(130,10,0xffffff);
  /* clock */
  begin();E(110,12,4.6,4.6,0xe2604f);stamp();Dd(110,12,3.4,0xfbf4e0);
  const hr=2+8*t,ah=(hr%12)/12*2*PI,am=fr(hr)*2*PI;
  Ld(110,12,110+Math.sin(am)*3,12-Math.cos(am)*3,0x4a4063);
  Ld(110,12,110+Math.sin(ah)*1.9,12-Math.cos(ah)*1.9,0xc03f35);S(110,12,OUT);
  /* shelves, jelly jars, books */
  begin();R(147,13,21,1,0xb9794a);R(147,23,21,1,0xb9794a);P(149,14,0x8a5530);P(165,14,0x8a5530);P(149,24,0x8a5530);P(165,24,0x8a5530);stamp();
  [0xff8fb5,0xb7e36a,0xffa64d,0x7fc8f8].forEach((c,i)=>{const x=149+i*5;begin();R(x,9,4,4,c);R(x,8,4,1,0xfbf1d8);stamp();
    S(x+1,10,mixc(c,0xffffff,.6));S(x+1,11,mixc(c,0xffffff,.3));});
  [[149,16,2,7,0xd9534f],[152,17,2,6,0x4f86d9],[155,16,3,7,0xf2c14e],[159,18,2,5,0x4fae6a]].forEach(b=>{begin();R(b[0],b[1],b[2],b[3],b[4]);stamp();
    S(b[0],b[1]+2,mixc(b[4],0xffffff,.55));});
  begin();R(163,19,4,4,0xb99cff);R(163,18,4,1,0xfbf1d8);stamp();S(164,20,0xe6dcff);
}
function drawBulbs(){
  for(let x=6;x<=170;x++)S(x,wireY(x),0x4a3b5c);
  for(let i=0;i<NB;i++){const c=BCOL[i%6],on=bulbLit[i],x=BX[i],y=BY[i];
    begin();R(x-1,y,2,2,on?c:mixc(c,0x6b6480,.68));stamp(on?2:0);if(on)S(x-1,y,0xffffff,2);}
}
function drawRug(){
  const sc=[0xf0705a,0xf7ead0,0x3fa7a0,0xf7ead0];begin();
  for(let y=43;y<=48;y++){const e=(y===43||y===48)?2:0;for(let x=66+e;x<=125-e;x++)P(x,y,sc[(((x-66)/4)|0)&3]);}
  stamp();for(const y of[44,46]){S(65,y,0xf7ead0);S(126,y,0xf7ead0);}
}
function drawFurniture(T,pulse,musicOn){
  /* pouf */
  begin();E(157,41,7,3.2,0xf0705a);stamp();F(152,41,11,1,0xf7ead0);F(154,39,7,1,0xf89a86);
  /* plant */
  const sw=Math.sin(T*1.3)*1.1+(musicOn?(Math.floor(beat)&1?1:-1)*(fr(beat)<.5?1.6:.7):0);
  const tips=[[128,27,1],[133,23,1],[138,26,1],[130,31,.5],[136,31,.5]];
  begin();for(const[x,y,k]of tips){const tx=Math.round(x+sw*k);Ln(133,36,tx,y+2,0x3a8f58);E(tx,y,1.6,2.4,0x4fae6a);}stamp();
  for(const[x,y,k]of tips)S(Math.round(x+sw*k),y,0x86d695);
  begin();R(130,38,7,5,0xd9744f);R(129,37,9,2,0xe88a62);stamp();
  /* floor lamp */
  begin();R(78,43,7,1,0xc9973f);R(79,42,5,1,0xc9973f);R(81,17,1,25,0xc9973f);stamp();
  begin();for(let y=10;y<=16;y++){const hw=3+(((y-10)*.45)|0);R(81-hw,y,hw*2+1,1,lampOn?0xe6fff2:0x8fd9b8);}stamp(lampOn?2:0);
  F(76,15,11,1,lampOn?0xb8f5d8:0x6fc4a0,lampOn?2:0);if(lampOn)S(81,17,0xfff2b0,2);

  let v=null;
  switch(e.key){case'ArrowRight':case'ArrowUp':v=tgt+.05;break;case'ArrowLeft':case'ArrowDown':v=tgt-.05;break;
    case'PageUp':v=tgt+.2;break;case'PageDown':v=tgt-.2;break;case'Home':v=0;break;case'End':v=1;break;
    case' ':case'Enter':v=tgt<.5?1:0;break;default:return;}
  e.preventDefault();firstTouch();tgt=clamp(v,0,1);
});

/* ───────────── simulation + story ───────────── */
function physics(dt){
  let n=Math.max(1,Math.ceil(dt*240));const h=dt/n;
  for(;n--;){
    const acc=170*(tgt-pos)-17*vel;vel+=acc*h;pos+=vel*h;
    if(pos<0){pos=0;if(vel<0){wv+=vel*.5;vel*=-.25;}}
    if(pos>1){pos=1;if(vel>0){wv+=vel*.5;vel*=-.25;}}
    wv+=(-420*wob-9*wv-acc*.3)*h;wob+=wv*h;
  }
  wob=clamp(wob,-.2,.2);
  strX=clamp((1+Math.min(.3,Math.abs(vel)*.05))*(1+wob),.88,1.36);strY=1/Math.sqrt(strX);
}
function story(dt,T){
  t=clamp(pos,0,1);kx=KX0+KR*t;sky=clamp(t/.8,0,1);dz=sm(.05,.8,t);
  const lo=t>=(lampOn?.09:.10);if(lo!==lampOn){lampOn=lo;sLamp(lo);}
  const aw=t>=(catAwake?.19:.20);if(aw!==catAwake){catAwake=aw;if(aw)sMrrp();}
  for(let i=0;i<NB;i++){const on=kx+16>=BX[i]?1:0;if(on!==bulbLit[i]){bulbLit[i]=on;sBulb(i,on);}}
  const pt=t>(party?.86:.9);if(pt!==party){party=pt;if(pt)sPartyIn();else sPartyOut();}
  partyAmt=clamp(partyAmt+(party?dt*1.6:-dt*2.2),0,1);
  if(!pupIn&&t>=.985){pupIn=true;sYip();}else if(pupIn&&t<.78)pupIn=false;
  if(pupIn){doorOp=Math.min(1,doorOp+dt*2.6);if(doorOp>.5)pupPos=Math.min(1,pupPos+dt*.85);}
  else{pupPos=Math.max(0,pupPos-dt*1.3);if(pupPos<.05)doorOp=Math.max(0,doorOp-dt*2.6);}
  const pwz=t>=.8&&!pupIn&&doorOp<.02;if(pwz&&!pupWait)knockT=.45;pupWait=pwz;
  if(pupWait){knockT-=dt;if(knockT<=0){knockT=2.8;hits.push(T+.02,T+.27,T+.52);sKnock();}}
  while(hits.length&&T-hits[0]>1)hits.shift();
  /* crescent echoes */
  for(const e of echoes)e.age+=dt;while(echoes.length&&echoes[0].age>.5)echoes.shift();
  echoT-=dt;if(Math.abs(vel)*KR>70&&echoT<=0){echoT=.055;echoes.push({x:KX0+KR*pos,dir:Math.sign(vel),age:0});}
  const lv=A.lv;lv.n=1-sm(.1,.3,t);lv.l1=sm(.08,.2,t);lv.l2=sm(.3,.42,t);lv.l3=sm(.52,.66,t);
  beat=(A.ctx&&A.ctx.state==='running')?Math.max(0,(A.ctx.currentTime-A.t0)/.6):T/.6;
}
/* ───────────── page + readouts ───────────── */
const $=id=>document.getElementById(id),rClock=$('rClock'),rLight=$('rLight'),rMusic=$('rMusic'),root=document.documentElement,
  theme=document.querySelector('meta[name=theme-color]');
let lastBg='',lastFg='',lastAria=-1,bg=[23,21,43];
function ui(){
  bg=[Math.round(23+205*dz),Math.round(21+205*dz),Math.round(43+193*dz)];
  const sb=bg.join(',');if(sb!==lastBg){lastBg=sb;root.style.setProperty('--bg',sb);theme.content='rgb('+sb+')';}
  const sf=bg[1]<118?'236,234,248':'28,25,48';if(sf!==lastFg){lastFg=sf;root.style.setProperty('--fg',sf);}
  const m=Math.round(120+480*t),ck=String((m/60)|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const li=party?'Party':t<.14?'Night':t<.38?'First light':t<.62?'Sunrise':'Morning';
  const mu=party?'Party':t<.14?'Crickets':t<.36?'Music box':t<.59?'Beat':'Band';
  if(rClock.textContent!==ck)rClock.textContent=ck;if(rLight.textContent!==li)rLight.textContent=li;if(rMusic.textContent!==mu)rMusic.textContent=mu;
  const av=Math.round(tgt*100);if(av!==lastAria||cv.getAttribute('aria-valuetext')!==ck+', '+li){lastAria=av;cv.setAttribute('aria-valuenow',av);cv.setAttribute('aria-valuetext',ck+', '+li);}
}
/* ───────────── go ───────────── */
if(!gl){stage.innerHTML='<p class="nogl">This study needs WebGL2.</p>';return;}
try{initGL();}catch(err){console.error(err);stage.innerHTML='<p class="nogl">The shader failed to compile on this device.</p>';return;}
resize();new ResizeObserver(resize).observe(stage);window.addEventListener('resize',resize);
if(hm){for(let i=0;i<220;i++){physics(.02);story(.02,i*.02-9);}hits.length=0;echoes.length=0;}
let last=performance.now()/1000;
function frame(ms){
  const T=ms/1000,dt=clamp(T-last,0,.05);last=T;
  physics(dt);story(dt,T);drawRoom(T);light(T);ui();render(bg);audioFrame(Math.abs(vel));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
